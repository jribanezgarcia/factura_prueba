<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú principal · Facturación</title>
  <style>
    :root {
      --bg: #E8EAED;
      --surface: #FFFFFF;
      --surface-secondary: #F2F4F6;
      --text: #1F2937;
      --text-secondary: #6B7280;
      --accent: #296796;
      --accent-hover: #1A55A8;
      --accent-text: #FCF9F9;
      --border: #D8DBDF;
      --shadow: 0 4px 16px rgba(31,41,55,0.10);
      --radius: 14px;
      --radius-sm: 10px;
      --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 28px;
    }
    .window { max-width: 960px; margin: 0 auto; }
    .header {
      text-align: center;
      margin-bottom: 22px;
    }
    .header h1 { font-size: 22px; margin: 0 0 4px; }
    .header p { margin: 0; color: var(--text-secondary); font-size: 13px; }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .content {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
    }
    .company {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .logo-box {
      background: var(--surface-secondary);
      border-radius: var(--radius-sm);
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
    }
    .logo-box svg { width: 64px; height: 64px; color: var(--accent); }
    .company-name { font-size: 18px; font-weight: 700; }
    .company-info { font-size: 13px; color: var(--text-secondary); line-height: 1.45; }
    .menu-list { padding: 18px; display: flex; flex-direction: column; gap: 8px; }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      transition: background 120ms ease, transform 80ms ease;
    }
    .menu-item:hover { background: var(--surface-secondary); }
    .menu-item:active { transform: scale(0.99); }
    .menu-item .icon {
      width: 28px; height: 28px;
      background: var(--accent);
      color: var(--accent-text);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .menu-item .icon svg { width: 18px; height: 18px; fill: currentColor; }
    .menu-item .text { flex: 1; }
    .menu-item .name { display: block; font-size: 15px; font-weight: 600; }
    .menu-item .desc { display: block; font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .chevron { color: var(--text-secondary); width: 18px; height: 18px; }
    @media (max-width: 760px) {
      .content { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="header">
      <h1>Facturación</h1>
      <p>Fecha de trabajo: 31/08/2026</p>
    </div>
    <div class="content">
      <div class="card company">
        <div class="logo-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="company-name">Alcazaba Instalaciones SL</div>
        <div class="company-info">B-12345678<br>C/ Mayor, 23 · 18001 Granada</div>
      </div>
      <div class="card menu-list">
        <button class="menu-item">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></span>
          <span class="text"><span class="name">Nueva factura</span><span class="desc">Crear o editar una factura de la serie activa</span></span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button class="menu-item">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg></span>
          <span class="text"><span class="name">Generar facturas mensuales</span><span class="desc">Crear varias facturas de un cliente a la vez</span></span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button class="menu-item">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg></span>
          <span class="text"><span class="name">Histórico</span><span class="desc">Consultar y buscar todas las facturas</span></span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button class="menu-item">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
          <span class="text"><span class="name">Clientes</span><span class="desc">Gestionar el catálogo de clientes</span></span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button class="menu-item">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.05-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></span>
          <span class="text"><span class="name">Configuración</span><span class="desc">Datos de empresa, cabecera, IVA y series</span></span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button class="menu-item">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg></span>
          <span class="text"><span class="name">Copia de seguridad</span><span class="desc">Fotografía completa de la base de datos</span></span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button class="menu-item">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg></span>
          <span class="text"><span class="name">Salir</span><span class="desc">Cierra la aplicación</span></span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
