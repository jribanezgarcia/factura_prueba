<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración · Facturación</title>
  <style>
    :root {
      --bg: #E8EAED;
      --surface: #FFFFFF;
      --surface-secondary: #F2F4F6;
      --text: #1F2937;
      --text-secondary: #6B7280;
      --accent: #296796;
      --accent-hover: #1A55A8;
      --accent-text: #FCF9F9;
      --border: #D8DBDF;
      --shadow: 0 4px 16px rgba(31,41,55,0.10);
      --radius: 14px;
      --radius-sm: 10px;
      --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; padding: 22px; }
    .window { max-width: 1060px; margin: 0 auto; }
    .nav { display: flex; justify-content: center; gap: 32px; padding: 10px 0; font-size: 13px; color: var(--text-secondary); }
    .nav span { cursor: pointer; }
    .nav span.active { color: var(--accent); font-weight: 600; }
    .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .header-row h1 { font-size: 22px; margin: 0; }
    .layout { display: grid; grid-template-columns: 240px 1fr; gap: 18px; }
    .sidebar { display: flex; flex-direction: column; gap: 6px; }
    .menu-item {
      display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--radius-sm);
      background: transparent; border: none; width: 100%; text-align: left; color: var(--text);
      font-family: inherit; font-size: 14px; cursor: pointer; transition: background 120ms ease;
    }
    .menu-item:hover { background: var(--surface-secondary); }
    .menu-item.active { background: var(--accent); color: var(--accent-text); }
    .menu-item .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: 0.5; }
    .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); padding: 20px; }
    .section-title { font-size: 18px; font-weight: 700; margin: 0 0 16px; }
    .group { background: var(--surface-secondary); border-radius: var(--radius-sm); border: 1px solid var(--border); overflow: hidden; margin-bottom: 16px; }
    .group-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); padding: 10px 16px; margin: 0; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--border); }
    .row:first-of-type { border-top: none; }
    .row label { font-size: 14px; }
    input, select { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; outline: none; min-width: 220px; }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(41,103,150,0.15); }
    .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    button { font-family: inherit; font-size: 13px; border-radius: var(--radius-sm); padding: 8px 16px; border: 1px solid var(--border); cursor: pointer; background: var(--surface-secondary); color: var(--text); transition: background 120ms ease, transform 80ms ease; }
    button:hover { filter: brightness(0.97); }
    button:active { transform: scale(0.98); }
    .primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
    .primary:hover { background: var(--accent-hover); }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="window">
    <div class="nav"><span>Menú</span><span>Factura</span><span>Histórico</span><span class="active">Configuración</span></div>
    <div class="header-row"><h1>Configuración</h1></div>
    <div class="layout">
      <div class="sidebar">
        <button class="menu-item active"><span class="dot"></span> Empresa</button>
        <button class="menu-item"><span class="dot"></span> Cabecera</button>
        <button class="menu-item"><span class="dot"></span> Pie</button>
        <button class="menu-item"><span class="dot"></span> IVA</button>
        <button class="menu-item"><span class="dot"></span> Retenciones</button>
        <button class="menu-item"><span class="dot"></span> Series</button>
        <button class="menu-item"><span class="dot"></span> Empresas</button>
        <button class="menu-item"><span class="dot"></span> PDFs</button>
      </div>
      <div class="card">
        <div class="section-title">Empresa</div>
        <div class="group">
          <h4 class="group-title">Datos fiscales</h4>
          <div class="row"><label>Nombre / razón social</label><input value="Alcazaba Instalaciones SL"></div>
          <div class="row"><label>NIF</label><input value="B-12345678"></div>
          <div class="row"><label>Actividad</label><input value="Instalación de cocinas y puertas"></div>
        </div>
        <div class="group">
          <h4 class="group-title">Dirección</h4>
          <div class="row"><label>Dirección</label><input value="C/ Mayor, 23"></div>
          <div class="row"><label>Código postal</label><input value="18001"></div>
          <div class="row"><label>Localidad</label><input value="Granada"></div>
          <div class="row"><label>Provincia</label><input value="Granada"></div>
          <div class="row"><label>Email</label><input value="info@alcazaba.es"></div>
          <div class="row"><label>Teléfono</label><input value="958 12 34 56"></div>
        </div>
        <div class="group">
          <h4 class="group-title">Apariencia</h4>
          <div class="row">
            <label>Tema de la aplicación</label>
            <select><option>Biblioteca8</option><option>Omarchy</option><option>Esmeralda</option></select>
          </div>
        </div>
        <div class="actions">
          <button class="primary">Guardar configuración</button>
          <button>Volver</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
